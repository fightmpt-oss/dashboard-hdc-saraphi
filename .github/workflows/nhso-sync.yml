# ดึงข้อมูลกองทุนแพทย์แผนไทย สปสช. (MeData) บนคลาวด์ — ไม่ต้องเปิดเครื่องตัวเอง
#
# ทริกเกอร์ 3 ทาง:
#   1. อัตโนมัติทุกวัน 02:30 น. เวลาไทย (cron 19:30 UTC) — MeData อัปเดตที่ไหน
#      เว็บเราอัปเดตตามโดยไม่ต้องกดอะไรเลย
#   2. ปุ่ม "ดึงข้อมูล สปสช. ล่าสุด (Live Sync)" บนเว็บ → Vercel Function
#      (api/nhso-sync.js) → สั่งดึงทันทีตามสั่ง (ใช้เมื่อรู้ว่า MeData เพิ่งอัปเดต)
#   3. กดมือในแท็บ Actions ของ GitHub (Run workflow)
#
# สคริปต์สกัดหน้าจอ Tableau MeData ด้วย Playwright (headless Chromium) แล้ว
# commit ไฟล์ data/nhso/*.json — push แล้ว Vercel deploy อัตโนมัติ
#
# หมายเหตุ: โดเมน medata.nhso.go.th เป็นบริการสาธารณะ (ไม่ต้องล็อกอิน) แต่ถ้า
# NHSO บล็อก IP ของคลาวด์ในอนาคต รอบนี้จะ fail ให้เห็นใน log ทันที

name: nhso-sync

on:
  schedule:
    - cron: "30 19 * * *" # 02:30 Asia/Bangkok ทุกวัน (หลัง auto-fetch MoPH 02:00)
  workflow_dispatch:
    inputs:
      fast:
        description: 'โหมดเร็ว (ข้าม granular per-unit/per-drug)'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [nhso-sync]

concurrency:
  group: nhso-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium (with system deps)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run MeData sync (Playwright scrape)
        run: |
          FAST="${{ github.event.inputs.fast }}${{ github.event.client_payload.fast }}"
          if [ "$FAST" = "true" ]; then
            # ปุ่มบนเว็บ: โหมดเร็ว (ข้าม granular per-unit/per-drug — รอบ nightly เก็บให้)
            python scripts/sync_nhso_medata_realtime.py --skip-granular
          else
            # nightly/รันมือ: granular เต็ม (มิติรายชนิดยาทั้งหมด)
            python scripts/sync_nhso_medata_realtime.py
          fi

      - name: Upload debug screenshot (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: medata-debug-screenshot
          path: _debug_medata*.png
          if-no-files-found: ignore

      - name: Commit refreshed MeData
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/nhso; then
            echo "ข้อมูล สปสช. ไม่เปลี่ยนแปลง — ไม่ commit"
          else
            git add data/nhso
            git commit -m "data: MeData sync via GitHub Actions ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "Pushed — Vercel will auto-deploy"
          fi
